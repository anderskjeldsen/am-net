id: async-socket-test
version: 1.0.0
type: application
# Smoke test for AsyncSocketStream.connectAsync — drives a TCP connect on
# the TaskScheduler's IO thread and suspends until it completes.
dependencies:
  - id: am-lang-core
    type: local
    path: ../../../am-lang-core
  - id: am-net
    type: local
    path: ../..
platforms:
  - id: libc
    abstract: true
  - id: macos
    extends: libc
    gccCommand: gcc -O3
  - id: macos-arm
    extends: libc
    gccCommand: gcc
  - id: linux-x64
    extends: libc
    gccCommand: gcc -O3
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
    gccAdditionalLibraries:
      - socket
  - id: morphos-ppc
    extends: libc
    gccCommand: ppc-morphos-gcc -O3
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul
buildTargets:
  - id: macos
    platform: macos
  - id: macos-arm
    platform: macos-arm
  - id: linux-x64
    platform: linux-x64
  - id: amigaos-docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
  - id: morphos-ppc_docker
    platform: morphos-ppc
    dockerBuild:
      image: amigadev/crosstools:ppc-morphos
      buildPath: /work
